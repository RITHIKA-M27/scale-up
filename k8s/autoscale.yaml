# Autoscaler: keeps average CPU near 50% by running between 1 and 5 pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-lab
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # Default is to wait 5 minutes before removing pods; 1 minute here
    # so you can watch scale-down within a short playground session.
    scaleDown:
      stabilizationWindowSeconds: 60
