# Load generator: 2 pods that request CPU-heavy work in a loop, forever.
# Start with `kubectl apply -f k8s/load.yaml`, stop with `kubectl delete -f k8s/load.yaml`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  replicas: 2
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O /dev/null 'http://scale-lab/api/work?cpu=100'; done"
